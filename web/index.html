<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오목 AI 대국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* 레이아웃: 왼쪽에 큰 바둑판, 오른쪽에 대국 정보 패널. 좁은 화면에서는 위아래로 쌓음 */
  :root {
    --bg: #eef0ea;
    --panel: #f8f9f5;
    --fg: #1d2420;
    --muted: #5c665f;
    --line: #d3d8cf;
    --accent: #2f5d50;
    --accent-fg: #ffffff;
    --wood: #d9b26f;
    --board-ink: #3b2a14;
    --win: #c2412d;
    --warn: #9a5b00;
    --stone-edge: #1d2420;
    --font-display: "Gowun Batang", "Batang", serif;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161a18; --panel: #1f2421; --fg: #e7ebe6; --muted: #9aa49d; --line: #333a36;
      --accent: #7fb7a4; --accent-fg: #0f1a16; --wood: #c99f5c; --board-ink: #2e200e;
      --win: #e0573f; --warn: #e2a64a; --stone-edge: #7a847d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161a18; --panel: #1f2421; --fg: #e7ebe6; --muted: #9aa49d; --line: #333a36;
    --accent: #7fb7a4; --accent-fg: #0f1a16; --wood: #c99f5c; --board-ink: #2e200e;
    --win: #e0573f; --warn: #e2a64a; --stone-edge: #7a847d; color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    padding-inline: 16px;
    padding-block: 24px 40px;
  }
  .wrap {
    max-width: 1040px;
    margin-inline: auto;
    display: grid;
    gap: 20px;
  }
  header { display: grid; gap: 4px; }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(26px, 4vw, 34px);
    line-height: 1.2;
    margin: 0;
    text-wrap: balance;
  }
  .sub { margin: 0; color: var(--muted); }

  .game {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .game { grid-template-columns: minmax(0, 1fr); }
  }

  .board-wrap { min-width: 0; }
  #board {
    display: block;
    width: 100%;
    max-width: 680px;
    aspect-ratio: 1 / 1;
    margin-inline: auto;
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.08), 0 14px 30px -12px rgba(40, 28, 10, 0.45);
    cursor: pointer;
    touch-action: manipulation;
  }
  #board.busy { cursor: progress; }

  .status {
    margin: 14px auto 0;
    max-width: 680px;
    min-height: 1.6em;
    font-weight: 500;
  }
  .status[data-tone="warn"] { color: var(--warn); }
  .status[data-tone="win"] { color: var(--accent); }
  .status[data-tone="lose"] { color: var(--win); }
  .status[data-tone="thinking"]::after {
    content: "";
    display: inline-block;
    width: 0.6em; height: 0.6em;
    margin-left: 0.5em;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.2; } }

  aside {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    display: grid;
    gap: 18px;
    min-width: 0;
  }
  .facts {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 14px;
    margin: 0;
  }
  .facts dt { color: var(--muted); font-size: 13px; letter-spacing: 0.02em; }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .stone {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid var(--stone-edge);
    background: #111;
  }
  .stone[data-color="w"] { background: #fafafa; }

  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  kbd {
    font-family: var(--font-mono); font-size: 12px;
    padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px;
  }

  .toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 8px;
  }
  #log {
    list-style: none; margin: 0; padding: 0;
    max-height: 220px; overflow-y: auto;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 8px;
    font-family: var(--font-mono); font-size: 13px;
  }
  #log li { display: flex; align-items: center; gap: 6px; }
  #log .num { color: var(--muted); min-width: 1.8em; text-align: right; }
  #log .dot { width: 9px; height: 9px; border-radius: 50%; background: #111; border: 1px solid var(--stone-edge); flex: none; }
  #log .dot[data-color="w"] { background: #fafafa; }
  .empty-log { color: var(--muted); font-size: 13px; margin: 0; }
  #log:not(:empty) + .empty-log { display: none; }

  .rules { font-size: 13px; color: var(--muted); margin: 0; }
  .rules strong { color: var(--fg); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .status[data-tone="thinking"]::after { animation: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>오목 AI 대국</h1>
    <p class="sub">흑을 잡고 AI(백)와 둡니다. 렌주 규칙이라 흑은 삼삼, 사사, 장목을 둘 수 없어요.</p>
  </header>

  <div class="game">
    <div class="board-wrap">
      <canvas id="board" aria-label="15줄 오목판. 교차점을 눌러 돌을 놓습니다."></canvas>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <aside>
      <dl class="facts">
        <dt>차례</dt><dd><span class="stone" id="turn-stone" data-color="b"></span></dd>
        <dt>수</dt><dd id="move-count">0</dd>
        <dt>마지막 수</dt><dd id="last-move">없음</dd>
        <dt>AI 계산</dt><dd id="ai-time">-</dd>
      </dl>

      <div class="buttons">
        <button type="button" id="undo">무르기 <kbd>Z</kbd></button>
        <button type="button" id="new-game" class="primary">새 게임</button>
        <button type="button" id="copy-log">기보 복사</button>
      </div>

      <label class="toggle" for="show-forbidden">
        <input type="checkbox" id="show-forbidden" checked>
        흑 차례에 금수 자리 표시
      </label>

      <div>
        <h2>기보</h2>
        <ol id="log"></ol>
        <p class="empty-log">아직 둔 수가 없습니다.</p>
      </div>

      <p class="rules"><strong>AI는 어떻게 두나요?</strong> 돌 주변 후보 중 위협이 큰 12곳을 골라 5수 앞까지 내다보고(네가맥스, 알파베타 가지치기) 열린 사, 닫힌 사, 열린 삼 같은 패턴 점수로 판을 평가합니다. 계산은 이 브라우저 안에서만 이뤄집니다.</p>
    </aside>
  </div>
</div>

<script src="engine.js"></script>
<script src="main.js"></script>
</body>
</html>
